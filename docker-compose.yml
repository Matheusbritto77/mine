services:
  minecraft-java-crossplay:
    image: itzg/minecraft-server:latest
    container_name: mc-java-server
    restart: unless-stopped
    environment:
      # Você precisa aceitar a EULA do Minecraft Java para rodar o servidor
      EULA: "TRUE"
      
      # Alocação de memória RAM para o Java (recomenda-se deixar 1GB livre na VPS para o SO e o Dokploy)
      MEMORY: "3G"
      
      # Ativação das flags de otimização G1GC do Aikar (previne picos de lag por Garbage Collection)
      USE_AIKAR_FLAGS: "true"
      
      # Tipo de servidor (Paper é altamente otimizado e aceita plugins Java)
      TYPE: "PAPER"
      VERSION: "LATEST"
      
      # Nome do servidor e configurações de jogo
      MOTD: "Servidor Crossplay Java & PE"
      DIFFICULTY: "normal"
      OPS: "" # Adicione os usernames (Java) separados por vírgula para Admin (OP) automático
      ONLINE_MODE: "true" # true = exige conta oficial para PC. Para pirata/offline, mude para false
      
      # Downloads automáticos de Plugins (GeyserMC + Floodgate)
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
      
    ports:
      # Porta padrão para computadores (Minecraft Java - TCP)
      - "25565:25565"
      # Porta padrão para celulares e consoles (Minecraft Bedrock/PE - UDP)
      - "19132:19132/udp"
      
    volumes:
      # Persistência de dados do servidor (mundos, plugins, logs)
      - ./data:/data
